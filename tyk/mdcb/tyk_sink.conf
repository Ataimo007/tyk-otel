{
    "listen_port": 9091,
    "http_port": 8181,
    "server_options": {
        "use_ssl": false
    },
    "storage": {
        "type": "redis",
        "host": "tyk-redis",
        "port": 6379,
        "enable_cluster": false
    },
    "security": {
        "private_certificate_encoding_secret": "SET_VIA_ENV_TYK_MDCB_SECURITY_PRIVATECERTIFICATEENCODINGSECRET",
        "enable_http_secure_endpoints": true,
        "secret": "SET_VIA_ENV_TYK_MDCB_SECURITY_SECRET"
    },
    "hash_keys": true,
    "forward_analytics_to_pump": true,
    "aggregates_ignore_tags": [],
    "analytics": {
        "mongo_url": "mongodb://tyk-mongo:27017/tyk_analytics"
    },
    "sync_worker_config": {
        "enabled": true,
        "hash_keys": true
    }
}
